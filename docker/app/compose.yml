name: hours
services:
  db:
    image: postgres:9.6-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
  app:
    image: hours-app
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      RAILS_ENV: test
    depends_on: [db]
  bench:
    image: hours-app
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres@db/hours_bench
      SECRET_KEY_BASE: benchmark-only-secret-0123456789abcdef0123456789abcdef
      SMTP_ADDRESS: localhost
      SMTP_DOMAIN: hours.test
      SMTP_USERNAME: bench
      SMTP_PASSWORD: bench
    depends_on: [db]
    command: >
      bash -c "bundle exec rake db:create db:schema:load DISABLE_DATABASE_ENVIRONMENT_CHECK=1 >/dev/null &&
               bundle exec rails runner script/benchmark/seed.rb >&2 &&
               bundle exec rake assets:precompile >/dev/null 2>&1 &&
               bundle exec rails runner script/benchmark/run.rb"
  # Manual testing in a browser: http://acme.localhost:3000  (user1@acme.test / benchmark-password)
  web:
    image: hours-app
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      TLD_LENGTH: "0"
    ports:
      - "3000:3000"
    depends_on: [db]
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               (bundle exec rake db:create db:schema:load >/dev/null && bundle exec rails runner script/benchmark/seed.rb) &&
               bundle exec rails server -b 0.0.0.0 -p 3000"
